name: Site quality checks

on:
  push:
    branches: [main, qa-hardening-2026-11-02, careers-role-detail-pages-2026-11-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate routes and accessibility basics
        run: python validate_site.py
      - name: Validate SEO, structured data and analytics
        run: python scripts/validate_seo_analytics.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/config.js
          node --check assets/js/main.js
          node --check assets/js/assistant-knowledge.js
          node --check assets/js/careers.js
          node --check assets/js/blog-archive.js
          node --check assets/js/project-assessment.js
      - name: Run chatbot tests
        run: node tests/chatbot-intents.test.cjs
      - name: Run analytics event tests
        run: node tests/analytics-events-static.test.cjs
      - name: Run brand and blog tests
        run: node tests/brand-blog-qa.test.cjs
      - name: Validate original GrapeCrux PNG branding
        run: node tests/sitewide-original-logo.test.cjs
      - name: Validate new blogs, curation and Google tag
        run: node tests/new-blogs-ga4-curation.test.cjs
      - name: Validate additive topic hubs and internal discovery
        run: node tests/additive-topic-hubs.test.cjs
      - name: Run Careers role-page tests
        run: node tests/careers-role-pages.test.cjs
      - name: Validate client conversion and 24 new articles
        run: node tests/client-conversion-24-blogs.test.cjs
      - name: Validate business visibility and enquiry platform
        run: node tests/business-platform-qa.test.cjs
