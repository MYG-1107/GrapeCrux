name: Technical SEO regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-seo-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-seo:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check live audit script syntax
        run: node --check scripts/audit_live_seo.mjs
      - name: Test HTML metadata parser (attribute order variants)
        run: node --test tests/live-seo-meta-parser.test.mjs
      - name: Check sitemap, canonicals, titles and crawlable links
        run: node tests/technical-seo-crawlability.test.cjs
